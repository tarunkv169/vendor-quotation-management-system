spring.application.name=approval-service
server.port=8087

# ---------- Database ----------
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/approval_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:admin123}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true
spring.data.web.pageable.max-page-size=100

# ---------- Security ----------
vqms.security.jwt.secret=${JWT_SECRET}
vqms.security.jwt.algorithm=${JWT_ALGORITHM:HS512}
vqms.security.jwt.role-claim=role
vqms.security.jwt.user-id-claim=userId
vqms.security.jwt.vendor-id-claim=vendorId
vqms.security.jwt.service-user-id=${SERVICE_USER_ID:00000000-0000-0000-0000-0000000000aa}
vqms.security.jwt.service-token-ttl=PT5M

# ---------- Downstream services ----------
services.recommendation.base-url=${RECOMMENDATION_SERVICE_URL:http://localhost:8086}
services.procurement.base-url=${PROCUREMENT_SERVICE_URL:http://localhost:8081}
services.identity.base-url=${IDENTITY_SERVICE_URL:http://localhost:8081}
services.notification.base-url=${NOTIFICATION_SERVICE_URL:http://localhost:8089}
services.http.connect-timeout=PT3S
services.http.read-timeout=PT5S

# ---------- Approval workflow ----------
vqms.approval.escalation-check-interval=PT5M
vqms.approval.max-delegation-days=60

# ---------- Business events (stored in the transactional outbox) ----------
vqms.messaging.approval-events-topic=vqms.approval.events

# ---------- Errors / Jackson / Actuator / OpenAPI ----------
server.error.include-message=never
server.error.include-stacktrace=never
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
logging.pattern.level=%5p [%X{correlationId:-}]

# ---- Service registration (Eureka). Off unless EUREKA_ENABLED=true (set by run-local.ps1 and docker-compose). ----
eureka.client.enabled=${EUREKA_ENABLED:false}
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true
