spring.application.name=reporting-service
server.port=8091

# ---------- Database ----------
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/reporting_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:admin123}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true
spring.data.web.pageable.max-page-size=100

# ---------- Security ----------
vqms.security.jwt.secret=${JWT_SECRET}
vqms.security.jwt.algorithm=${JWT_ALGORITHM:HS512}
vqms.security.jwt.role-claim=role
vqms.security.jwt.user-id-claim=userId
vqms.security.jwt.vendor-id-claim=vendorId
vqms.security.jwt.service-user-id=${SERVICE_USER_ID:00000000-0000-0000-0000-0000000000ad}
vqms.security.jwt.service-token-ttl=PT5M

# ---------- Data sources (authoritative services) ----------
services.quotation.base-url=${QUOTATION_SERVICE_URL:http://localhost:8082}
services.validation.base-url=${VALIDATION_SERVICE_URL:http://localhost:8084}
services.comparison.base-url=${COMPARISON_SERVICE_URL:http://localhost:8085}
services.recommendation.base-url=${RECOMMENDATION_SERVICE_URL:http://localhost:8086}
services.approval.base-url=${APPROVAL_SERVICE_URL:http://localhost:8087}
services.http.connect-timeout=PT3S
services.http.read-timeout=PT10S
# Upper bound of source rows read for one report (pages of 100).
vqms.reporting.max-source-rows=5000

# ---------- Service registry (optional) ----------
eureka.client.enabled=${EUREKA_ENABLED:false}
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true

# ---------- Errors / Jackson / Actuator / OpenAPI ----------
server.error.include-message=never
server.error.include-stacktrace=never
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
logging.pattern.level=%5p [%X{correlationId:-}]

