spring.application.name=recommendation-service
server.port=8086

# ---------- Database ----------
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/recommendation_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:admin123}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true
spring.data.web.pageable.max-page-size=100

# ---------- Security ----------
vqms.security.jwt.secret=${JWT_SECRET}
vqms.security.jwt.algorithm=${JWT_ALGORITHM:HS512}
vqms.security.jwt.role-claim=role
vqms.security.jwt.user-id-claim=userId
vqms.security.jwt.vendor-id-claim=vendorId
vqms.security.jwt.service-user-id=${SERVICE_USER_ID:00000000-0000-0000-0000-0000000000a9}
vqms.security.jwt.service-token-ttl=PT5M

# ---------- Downstream services ----------
services.comparison.base-url=${COMPARISON_SERVICE_URL:http://localhost:8085}
services.procurement.base-url=${PROCUREMENT_SERVICE_URL:http://localhost:8081}
services.validation.base-url=${VALIDATION_SERVICE_URL:http://localhost:8084}
services.http.connect-timeout=PT3S
services.http.read-timeout=PT5S

# ---------- Default recommendation policy ----------
vqms.recommendation.minimum-overall-score=50
vqms.recommendation.abnormally-low-price-percent=30
vqms.recommendation.slow-delivery-factor=1.5
vqms.recommendation.max-alternatives=2
vqms.recommendation.score-scale=4
# Validation results that keep a quotation eligible (must match the comparison service setting).
vqms.recommendation.eligible-validation-statuses=${COMPARISON_ELIGIBLE_VALIDATION_STATUSES:PASSED,NEEDS_REVIEW}

# ---------- Business events (stored in the transactional outbox) ----------
vqms.messaging.recommendation-events-topic=vqms.recommendation.events

# ---------- Errors / Jackson / Actuator / OpenAPI ----------
server.error.include-message=never
server.error.include-stacktrace=never
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
logging.pattern.level=%5p [%X{correlationId:-}]

# ---- Service registration (Eureka). Off unless EUREKA_ENABLED=true (set by run-local.ps1 and docker-compose). ----
eureka.client.enabled=${EUREKA_ENABLED:false}
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true
