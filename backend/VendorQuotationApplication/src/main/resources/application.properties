spring.application.name=VendorQuotationApplication

# Server Configuration
server.port=8081

# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/vqms
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:admin123}

# Hibernate / JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# File Upload Configuration
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
vqms.upload.dir=./uploads

# Mail Configuration (disabled - optional for notifications)
spring.mail.host=localhost
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.default-encoding=UTF-8
spring.mail.auto-startup=false

# OpenAPI / Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
# Optional infrastructure must not mark the service DOWN while it is switched off.
management.health.mail.enabled=${EMAIL_ENABLED:false}

# ---- Service registration (Eureka). Off unless EUREKA_ENABLED=true (set by run-local.ps1 and docker-compose). ----
eureka.client.enabled=${EUREKA_ENABLED:false}
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true

# ---------- In-app notifications (outbox -> Notification Service) ----------
vqms.notifications.enabled=${NOTIFICATIONS_ENABLED:true}
vqms.notifications.base-url=${NOTIFICATION_SERVICE_URL:http://localhost:8089}
vqms.notifications.relay-interval=PT3S
vqms.notifications.max-attempts=8
