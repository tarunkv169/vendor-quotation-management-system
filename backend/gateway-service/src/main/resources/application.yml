server:
  port: ${GATEWAY_PORT:8080}

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      # Requests and responses are streamed; uploads up to the Document Service limit pass through.
      httpclient:
        connect-timeout: 3000
        response-timeout: 60s
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials X-Correlation-Id, RETAIN_UNIQUE
        # CORS is decided here at the edge; backends must not re-check the browser Origin.
        - RemoveRequestHeader=Origin
      # Each URI can be overridden per environment (docker-compose sets http://<service>:<port>;
      # with Eureka enabled you may use lb://<service-name>).
      routes:
        # ---- Monolith (Identity, Vendor, Procurement, Settings; Quotations used by the current UI) ----
        - id: monolith
          uri: ${MONOLITH_URI:http://localhost:8081}
          predicates:
            - Path=/api/v1/auth/**,/api/v1/vendors/**,/api/v1/procurement-requests/**,/api/v1/settings/**,/api/v1/quotations/**
        # ---- Microservices ----
        - id: document-service
          uri: ${DOCUMENT_SERVICE_URI:http://localhost:8083}
          predicates:
            - Path=/api/v1/documents/**
        - id: ai-extraction-service
          uri: ${AI_EXTRACTION_SERVICE_URI:http://localhost:8090}
          predicates:
            - Path=/api/v1/extractions/**
        - id: validation-service
          uri: ${VALIDATION_SERVICE_URI:http://localhost:8084}
          predicates:
            - Path=/api/v1/validations/**
        - id: comparison-service
          uri: ${COMPARISON_SERVICE_URI:http://localhost:8085}
          predicates:
            - Path=/api/v1/comparisons/**
        - id: recommendation-service
          uri: ${RECOMMENDATION_SERVICE_URI:http://localhost:8086}
          predicates:
            - Path=/api/v1/recommendations/**
        - id: approval-service
          uri: ${APPROVAL_SERVICE_URI:http://localhost:8087}
          predicates:
            - Path=/api/v1/approvals/**,/api/v1/approval-policies/**
        - id: audit-service
          uri: ${AUDIT_SERVICE_URI:http://localhost:8088}
          predicates:
            - Path=/api/v1/audit/**
        - id: notification-service
          uri: ${NOTIFICATION_SERVICE_URI:http://localhost:8089}
          predicates:
            - Path=/api/v1/notifications/**
        - id: reporting-service
          uri: ${REPORTING_SERVICE_URI:http://localhost:8091}
          predicates:
            - Path=/api/v1/reports/**

vqms:
  gateway:
    jwt-secret: ${JWT_SECRET}
    jwt-algorithm: ${JWT_ALGORITHM:HS512}
    role-claim: role
    user-id-claim: userId
    public-paths:
      - /api/v1/auth/login
      - /api/v1/auth/register
      - /actuator/health/**
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

eureka:
  client:
    enabled: ${EUREKA_ENABLED:false}
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
