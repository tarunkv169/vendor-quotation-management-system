spring.application.name=validation-service
server.port=8084

# ---------- Database ----------
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/validation_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:admin123}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true

# ---------- Pagination ----------
spring.data.web.pageable.max-page-size=100

# ---------- Security (same contract as Identity Service; no default secret) ----------
vqms.security.jwt.secret=${JWT_SECRET}
vqms.security.jwt.algorithm=${JWT_ALGORITHM:HS512}
vqms.security.jwt.role-claim=role
vqms.security.jwt.user-id-claim=userId
vqms.security.jwt.vendor-id-claim=vendorId
vqms.security.jwt.service-user-id=${SERVICE_USER_ID:00000000-0000-0000-0000-0000000000a7}
vqms.security.jwt.service-token-ttl=PT5M

# ---------- Downstream services ----------
# Quotations are read from the platform application (VendorQuotationApplication), where the UI stores them.
# Override with QUOTATION_SOURCE_URL; defaults to the procurement/platform URL.
services.quotation.base-url=${QUOTATION_SOURCE_URL:${PROCUREMENT_SERVICE_URL:http://localhost:8081}}
services.vendor.base-url=${VENDOR_SERVICE_URL:http://localhost:8081}
services.procurement.base-url=${PROCUREMENT_SERVICE_URL:http://localhost:8081}
services.http.connect-timeout=PT3S
services.http.read-timeout=PT5S

# ---------- Validation rules ----------
vqms.validation.calculation-scale=4
vqms.validation.amount-tolerance=0.01
vqms.validation.allowed-tax-rates=0,5,12,18,28
vqms.validation.allowed-currencies=
vqms.validation.max-discount-rate=100
vqms.validation.price-deviation-warning-percent=30
vqms.validation.open-procurement-statuses=APPROVED,QUOTATION_REQUESTED,UNDER_EVALUATION
vqms.validation.active-quotation-statuses=SUBMITTED,UNDER_REVIEW,ACCEPTED

vqms.messaging.validation-events-topic=vqms.validation.events

# ---------- Errors / Jackson / Actuator / OpenAPI ----------
server.error.include-message=never
server.error.include-stacktrace=never
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
logging.pattern.level=%5p [%X{correlationId:-}]

# ---- Service registration (Eureka). Off unless EUREKA_ENABLED=true (set by run-local.ps1 and docker-compose). ----
eureka.client.enabled=${EUREKA_ENABLED:false}
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true
