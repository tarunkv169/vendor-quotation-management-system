spring.application.name=document-service
server.port=8083

# ---------- Database (env vars; defaults are for local development only) ----------
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/document_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.hikari.maximum-pool-size=10

# ---------- JPA: Flyway owns the schema, Hibernate only verifies it ----------
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ---------- Flyway ----------
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ---------- Multipart (outer limit; per-file rules are enforced in code) ----------
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=21MB
spring.servlet.multipart.file-size-threshold=1MB

# ---------- Pagination ----------
spring.data.web.pageable.max-page-size=100
spring.data.web.pageable.default-page-size=20

# ---------- Security: same secret/algorithm as Identity Service (no default secret on purpose) ----------
vqms.security.jwt.secret=${JWT_SECRET}
# Identity JwtUtil uses JJWT signWith(key) with a 66-byte key, which selects HS512.
vqms.security.jwt.algorithm=${JWT_ALGORITHM:HS512}
vqms.security.jwt.role-claim=role
vqms.security.jwt.user-id-claim=userId
vqms.security.jwt.vendor-id-claim=vendorId

# ---------- Document rules ----------
vqms.document.max-file-size=20MB
vqms.document.allowed-extensions=pdf,xlsx,png,jpg,jpeg
vqms.document.purge-file-on-delete=true
vqms.document.stale-upload-timeout=PT30M
vqms.document.stale-upload-cleanup-interval=PT10M

# ---------- S3 (credentials come from the AWS default provider chain: IAM role or env vars) ----------
# Feature flag: S3 (or LocalStack) switched OFF by default. While OFF, uploads/downloads return 503
# with a clear message; document metadata reads keep working. Set S3_ENABLED=true when S3 is available.
vqms.storage.s3.enabled=${S3_ENABLED:false}
vqms.storage.s3.bucket=${S3_BUCKET:vqms-documents-dev}
vqms.storage.s3.region=${AWS_REGION:ap-south-1}
# Empty for real AWS; http://localhost:4566 for LocalStack.
vqms.storage.s3.endpoint=${S3_ENDPOINT:}
vqms.storage.s3.path-style-access=${S3_PATH_STYLE:false}
vqms.storage.s3.key-prefix=documents
vqms.storage.s3.presigned-url-duration=PT5M

# ---------- Downstream services ----------
services.quotation.base-url=${QUOTATION_SERVICE_URL:http://localhost:8082}
services.vendor.base-url=${VENDOR_SERVICE_URL:http://localhost:8081}
services.http.connect-timeout=PT3S
services.http.read-timeout=PT5S

# ---------- Errors: never leak internals ----------
server.error.include-message=never
server.error.include-stacktrace=never

# ---------- Jackson ----------
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null

# ---------- Actuator ----------
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never

# ---------- OpenAPI ----------
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# ---------- Logging (correlation id is put in MDC by CorrelationIdFilter) ----------
logging.pattern.level=%5p [%X{correlationId:-}]

# ---- Service registration (Eureka). Off unless EUREKA_ENABLED=true (set by run-local.ps1 and docker-compose). ----
eureka.client.enabled=${EUREKA_ENABLED:false}
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true
